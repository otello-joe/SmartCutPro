name: Build SmartCut Pro

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # <--- 这里加上了空格

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsdl2-mixer-2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "SmartCutPro" --collect-all customtkinter --collect-all tkinterdnd2 --copy-metadata imageio --copy-metadata moviepy main.py

    - name: Zip Build (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist\SmartCutPro -DestinationPath SmartCutPro-Windows.zip

    - name: Tar Build (Linux)
      if: runner.os == 'Linux'
      run: tar -czvf SmartCutPro-Linux.tar.gz -C dist SmartCutPro

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SmartCutPro-Windows.zip
          SmartCutPro-Linux.tar.gz
