name: Build SmartCut Pro

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 【修复】：删除了 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24，退回稳定的 Node 20 环境
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-mixer-2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download FFmpeg (Windows)
      if: runner.os == 'Windows'
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        Copy-Item "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "."
        Copy-Item "ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "."

    - name: Download FFmpeg (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
        mkdir ffmpeg_extracted
        tar -xf ffmpeg-release-amd64-static.tar.xz -C ffmpeg_extracted --strip-components 1
        cp ffmpeg_extracted/ffmpeg .
        cp ffmpeg_extracted/ffprobe .
        chmod +x ffmpeg ffprobe

    - name: Build Executable with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "SmartCutPro" --collect-all customtkinter --collect-all tkinterdnd2 --copy-metadata imageio --copy-metadata moviepy --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." main.py

    - name: Build Executable with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "SmartCutPro" --collect-all customtkinter --collect-all tkinterdnd2 --copy-metadata imageio --copy-metadata moviepy --add-binary "ffmpeg:." --add-binary "ffprobe:." main.py

    - name: Zip Build (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist\SmartCutPro -DestinationPath SmartCutPro-Windows.zip

    - name: Tar Build (Linux)
      if: runner.os == 'Linux'
      run: tar -czvf SmartCutPro-Linux.tar.gz -C dist SmartCutPro

    - name: Upload to Release (Windows)
      if: runner.os == 'Windows'
      uses: softprops/action-gh-release@v2
      with:
        files: SmartCutPro-Windows.zip

    - name: Upload to Release (Linux)
      if: runner.os == 'Linux'
      uses: softprops/action-gh-release@v2
      with:
        files: SmartCutPro-Linux.tar.gz
